<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Auto-refresh every 5 seconds -->
    <meta http-equiv="refresh" content="5">
    <title>Currency Strength Output Matrix</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #191919 !important;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1a1d29;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .matrix-table thead tr {
            background-color: #262a3b;
            color: #9ea4b5;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .matrix-table th, .matrix-table td {
            padding: 12px 16px;
            text-align: left;
        }

        .matrix-table th:last-child, .matrix-table td:last-child {
            text-align: right;
        }

        .matrix-table tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: 500;
            font-size: 15px;
        }

        /* Bullish Rows (Dark Blue / Indigo) */
        .row-bullish {
            background-color: #1e3a8a;
            color: #93c5fd;
        }

        /* Bearish Rows (Dark Red / Crimson) */
        .row-bearish {
            background-color: #881337;
            color: #fca5a5;
        }

        /* Neutral Rows */
        .row-neutral {
            background-color: #374151;
            color: #d1d5db;
        }

        .symbol-col {
            font-weight: 700;
            text-decoration: underline;
        }

        .table-header {
            background-color: #1f2430;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #2e3545;
        }
    </style>
</head>
<body>

    <!-- Currency Output Table -->
    <div class="container">
        <table class="matrix-table">
            <thead>
                <tr>
                    <th colspan="3" class="table-header">Output</th>
                </tr>
                <tr>
                    <th>Symbol</th>
                    <th>Bias</th>
                    <th>Score ▾</th>
                </tr>
            </thead>
            <tbody>
                {% for pair in derived_pairs %}
                    <tr class="{% if 'Bullish' in pair.bias %}row-bullish{% elif 'Bearish' in pair.bias %}row-bearish{% else %}row-neutral{% endif %}">
                        <td class="symbol-col">{{ pair.symbol }}</td>
                        <td>{{ pair.bias }}</td>
                        <td>{{ pair.score }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
